name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two deploys race for the same objects.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing to install: the site is generated by a shell script and awk,
      # both of which the runner already has. 'make check' builds it and then
      # checks the result, so a broken link fails here rather than in the bucket.
      - name: Build and check the site
        run: make check

      - name: Show published paths
        run: find build -type f | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: build/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # for the OIDC token exchanged for the AWS role
      contents: read
    steps:
      # The artifact is the tree that was under build/, so this step leaves the
      # site rooted in the working directory: ./index.html, ./articles/, ./assets/.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Immutable and content-addressed, so they can be cached for a year and
      # never need invalidating. Uploaded BEFORE the pages, so no page is ever
      # live pointing at a stylesheet that is not there yet.
      #
      # Note there is no --delete anywhere in this job, by design: this bucket
      # holds the whole site, including the pages the tour-of-clips and
      # Wasm-CLIPSraylib repositories publish into it, and older builds have to
      # stay reachable for visitors still holding an older cached page.
      - name: Upload stylesheets
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp assets/ "s3://$BUCKET/assets/" --recursive \
            --content-type 'text/css; charset=utf-8' \
            --cache-control 'public, max-age=31536000, immutable'

      # Everything else: the pages and the media beside them. These keep their
      # names from build to build, so they are the objects that can go stale.
      # Short max-age because an invalidation clears CloudFront's edge caches but
      # not browsers': a long TTL here would strand returning visitors on old
      # html that no invalidation can reach.
      #
      # One pass per extension with an explicit --content-type, because S3 would
      # otherwise tag several of these as binary/octet-stream and hand a visitor
      # a download prompt instead of a page. ci/check.sh fails the build if a
      # file turns up whose extension is not on this list.
      - name: Upload pages and media
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          MUTABLE='public, max-age=60, must-revalidate'
          # The filters are applied in order and the last match wins, so
          # assets/ is excluded after the include rather than before it.
          upload() {
            aws s3 cp . "s3://$BUCKET/" --recursive \
              --exclude '*' --include "*.$1" --exclude 'assets/*' \
              --content-type "$2" --cache-control "$MUTABLE"
          }
          upload html 'text/html; charset=utf-8'
          upload css  'text/css; charset=utf-8'
          upload md   'text/markdown; charset=utf-8'
          upload txt  'text/plain; charset=utf-8'
          upload rss  'application/rss+xml; charset=utf-8'
          upload xml  'application/xml; charset=utf-8'
          upload webmanifest 'application/manifest+json; charset=utf-8'
          upload svg  'image/svg+xml'
          upload png  'image/png'
          upload jpg  'image/jpeg'
          upload ico  'image/vnd.microsoft.icon'
          upload mp4  'video/mp4'
          upload webm 'video/webm'

      # Only the mutable objects, because the stylesheets are addressed by
      # content. / is listed next to /index.html because the distribution serves
      # the front page under both and an invalidation of one does not clear the
      # other. Waiting on it makes a green check mean "live" rather than
      # "accepted".
      - name: Invalidate the pages
        env:
          DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          ID=$(aws cloudfront create-invalidation \
                --distribution-id "$DIST" \
                --paths / /index.html '/articles/*' /feed.rss \
                --query 'Invalidation.Id' --output text)
          echo "invalidation $ID"
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$ID"
